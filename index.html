<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liberty Leadership</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: desktop app shell. Left sidebar nav, wide content with two-column panels, right-side drawer for detail. Under 900px it folds into a phone layout with a bottom tab bar and bottom sheets. */
:root{
  --page:#FFFFFF; --card:#FFFFFF; --sunken:#F4F4F5; --line:#E7E7E9; --line2:#D9D9DD; --ink:#111113; --blue:#2563EB; --blue-soft:#EEF3FE; --weekend:#F6F6F7;
  --fg:#2E2D31; --fg-muted:#6A6A6F; --inverse:#FFFFFF;
  --accent:#008037; --accent-hover:#00682D; --accent-soft:#E5F2EA; --on-accent:#FFFFFF;
  --ok:#008037; --ok-soft:#E5F2EA; --warn:#8A5600; --warn-fill:#C77A00; --warn-soft:#FBEFD8; --bad:#C62828; --bad-soft:#FBE5E5; --neutral-soft:#EFEFF1;
  --tent:#5E7316;
  --shadow:0 1px 2px rgba(46,45,49,.05),0 2px 6px rgba(46,45,49,.04);
  --drawer:-12px 0 40px rgba(46,45,49,.14);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#111113; --card:#18181B; --sunken:#232327; --line:#2E2E33; --line2:#3D3D44; --ink:#F4F4F5; --blue:#6B9BFF; --blue-soft:#1C2740; --weekend:#1D1D21;
  --fg:#EDEDEF; --fg-muted:#A6A6AC; --inverse:#141416;
  --accent:#3DB36C; --accent-hover:#5CC484; --accent-soft:#1C3A27; --on-accent:#0E1F15;
  --ok:#5CC484; --ok-soft:#1C3A27; --warn:#F0C36B; --warn-fill:#D9A441; --warn-soft:#3B2F1B; --bad:#FF8A80; --bad-soft:#42201F; --neutral-soft:#2E2E33;
  --tent:#C9E36B; --shadow:none; --drawer:-12px 0 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#111113; --card:#18181B; --sunken:#232327; --line:#2E2E33; --line2:#3D3D44; --ink:#F4F4F5; --blue:#6B9BFF; --blue-soft:#1C2740; --weekend:#1D1D21;
  --fg:#EDEDEF; --fg-muted:#A6A6AC; --inverse:#141416;
  --accent:#3DB36C; --accent-hover:#5CC484; --accent-soft:#1C3A27; --on-accent:#0E1F15;
  --ok:#5CC484; --ok-soft:#1C3A27; --warn:#F0C36B; --warn-fill:#D9A441; --warn-soft:#3B2F1B; --bad:#FF8A80; --bad-soft:#42201F; --neutral-soft:#2E2E33;
  --tent:#C9E36B; --shadow:none; --drawer:-12px 0 40px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-muted)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;padding-left:max(14px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.brand{padding:0 10px;display:flex;flex-direction:column;gap:6px}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{align-self:flex-start;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.navv{display:flex;flex-direction:column;gap:2px}
.navv button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-weight:500;color:var(--fg-muted)}
.navv button:hover{background:var(--sunken);color:var(--fg)}
.navv button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navv button:focus-visible{outline:2px solid var(--accent)}
.navv .count{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--fg-muted);padding:0 10px}

.main{min-width:0;padding:26px 32px 48px;padding-right:max(32px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1360px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph small{display:block;font-size:12.5px;color:var(--fg-muted);font-weight:500}
.ph h1{font-size:28px;font-weight:700;letter-spacing:-.015em}
.ph p{color:var(--fg-muted);max-width:70ch;margin-top:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.cardh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 18px 10px}
.cardh h2{font-size:16px;font-weight:600}
.cardh span{font-size:12.5px;color:var(--fg-muted)}
.card,.cols>*,.dec>*,.kpis>*{min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.scroll{overflow-x:auto}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{font-size:13px;color:var(--fg-muted)}
.kpi .s{font-size:12.5px;color:var(--fg-muted)}
.kpi.bad .v{color:var(--bad)}
.kpi .mix{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;background:var(--sunken)}
.kpi .mix span:first-child{background:var(--warn-fill)}.kpi .mix span:last-child{background:var(--accent)}

/* rows and lists */
.li{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer}
.li:hover{background:var(--sunken)}
.li:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.li .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .body b{font-weight:600}
.li .body small{font-size:12.5px;color:var(--fg-muted)}
.li .chev{color:var(--fg-muted);width:16px;height:16px}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ico svg{width:18px;height:18px}
.ico.bad{background:var(--bad-soft);color:var(--bad)}.ico.warn{background:var(--warn-soft);color:var(--warn)}.ico.ok{background:var(--ok-soft);color:var(--ok)}.ico.n{background:var(--sunken);color:var(--fg-muted)}
.feed{display:flex;gap:12px;padding:11px 18px;border-top:1px solid var(--line);font-size:13.5px}
.feed .dt{width:8px;height:8px;border-radius:999px;background:var(--accent);margin-top:7px;flex:none}
.feed small{display:block;font-size:12px;color:var(--fg-muted)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.n{background:var(--neutral-soft);color:var(--fg-muted)}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:999px;background:currentColor}

/* week cells */
.wh,.wr{display:grid;grid-template-columns:minmax(170px,1.3fr) 120px repeat(8,minmax(44px,1fr)) 82px;gap:6px;align-items:center;padding:0 18px;min-width:820px}
.wh{font-size:12px;color:var(--fg-muted);padding-top:4px;padding-bottom:8px}
.wh span{text-align:center}.wh span:first-child,.wh span:nth-child(2){text-align:left}
.wr{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(170px,1.3fr) 120px repeat(8,minmax(44px,1fr)) 82px;gap:6px;align-items:center;padding:9px 18px;min-width:820px;width:100%;border-top:1px solid var(--line);cursor:pointer}
.wr:hover{background:var(--sunken)}
.wr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.wr.sub{background:var(--page);padding-left:42px;cursor:pointer}
.wr b{font-weight:600}.wr.sub b{font-weight:500}
.wr small{display:block;font-size:12px;color:var(--fg-muted);font-weight:400}
.cell{height:30px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-bad{background:var(--bad-soft);color:var(--bad)}
.hbar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:4px}
.hbar span{display:block;height:100%;border-radius:3px}
.wr .chev{color:var(--fg-muted);width:16px;height:16px;transition:transform .2s}
.wr[aria-expanded="true"] .chev{transform:rotate(90deg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-muted);padding:10px 18px 14px;align-items:center}

/* portfolio */
.seg{display:inline-flex;background:var(--sunken);padding:3px;border-radius:11px}
.seg button{all:unset;cursor:pointer;padding:7px 16px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--fg-muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.ph2,.pr{display:grid;grid-template-columns:minmax(230px,1.5fr) 140px 120px 80px minmax(320px,2.4fr);gap:14px;align-items:center;padding:0 18px;min-width:980px}
.ph2{font-size:12px;color:var(--fg-muted);padding-top:4px;padding-bottom:8px}
.pr{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(230px,1.5fr) 140px 120px 80px minmax(320px,2.4fr);gap:14px;align-items:center;padding:13px 18px;min-width:980px;width:100%;border-top:1px solid var(--line);cursor:pointer}
.pr:hover{background:var(--sunken)}
.pr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pr .nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.pr .nm b{font-weight:600}.pr .nm small{font-size:12px;color:var(--fg-muted)}
.pr .r,.ph2 .r{text-align:right}
.bar{display:block;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-bottom:5px}
.drawer>*{flex-shrink:0}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.gantt{position:relative;height:26px;border-radius:6px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/12 - 1px),var(--line) calc(100%/12 - 1px),var(--line) calc(100%/12))}
.gantt .gb{position:absolute;top:8px;height:10px;border-radius:5px;background:var(--accent)}
.gantt .gb.na{background:transparent;border:1.5px dashed var(--tent)}
.gantt .gm{position:absolute;top:8px;width:10px;height:10px;transform:rotate(45deg);background:var(--card);border:2px solid var(--fg);box-sizing:border-box}
.gantt .gm.done{background:var(--fg)}
.gantt .today{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--fg)}
.gl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--fg-muted)}

/* decisions */
.dec{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
.qi{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.qi:hover{background:var(--sunken)}
.qi[aria-pressed="true"]{background:var(--accent-soft)}
.qi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.qi .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qi b{font-weight:600}.qi small{font-size:12.5px;color:var(--fg-muted)}
.dpanel{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.dtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dtop h2{font-size:22px;font-weight:700}
.dtop small{font-size:12.5px;color:var(--fg-muted);font-weight:500}
.stepper{display:flex;align-items:center;gap:10px;background:var(--sunken);border-radius:14px;padding:6px}
.stepper button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:20px;font-weight:500;box-shadow:var(--shadow)}
.stepper button[disabled]{opacity:.35;pointer-events:none}
.stepper button:focus-visible{outline:2px solid var(--accent)}
.stepper div{text-align:center;min-width:150px}
.stepper small{display:block;font-size:11.5px;color:var(--fg-muted)}
.stepper b{font-size:16px}
.verdict{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.verdict.ok{background:var(--ok-soft)}.verdict.bad{background:var(--bad-soft)}.verdict.n{background:var(--sunken)}
.verdict b{font-size:17px}.verdict.ok b{color:var(--ok)}.verdict.bad b{color:var(--bad)}
.dgrid{border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.dgrid table{border-collapse:separate;border-spacing:4px;width:100%;font-size:12px}
.dgrid th{font-weight:500;color:var(--fg-muted);padding:6px;text-align:center;white-space:nowrap}
.dgrid th:first-child{text-align:left}
.dgrid td{height:32px;border-radius:7px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.dgrid td.lbl{text-align:left;font-weight:500;padding:0 6px;white-space:nowrap}
.dgrid td.lbl small{display:block;color:var(--fg-muted);font-weight:400}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:11px 20px;border-radius:11px;font-weight:600;background:var(--accent);color:var(--on-accent);min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--accent-hover)}
.btn.sec{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.sec:hover{background:var(--sunken)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,15,17,.32);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--page);box-shadow:var(--drawer);z-index:21;overflow-y:auto;padding:22px 24px 28px;padding-right:max(24px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:slide .22s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}.wr .chev{transition:none}}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh h2{font-size:21px;font-weight:700;line-height:1.25}
.dh small{font-size:12.5px;color:var(--fg-muted);font-weight:500}
.x{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;color:var(--fg-muted);flex:none}
.x:focus-visible{outline:2px solid var(--accent)}
.back{all:unset;cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:500}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.sect{font-size:12.5px;font-weight:600;color:var(--fg-muted);display:flex;justify-content:space-between;margin-top:4px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list .li:first-child,.list .feed:first-child{border-top:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lk{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--sunken)}
.why{padding:11px 14px;border-radius:12px;font-size:13.5px}
.w4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.w4 div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}

.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.qmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.qmain b{font-weight:600}.qmain small{font-size:12.5px;color:var(--fg-muted)}
.qact{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pick select,.selx,.fm select,.fm input[type=text]{font:inherit;color:var(--fg);background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:36px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick{position:relative}
.wt{display:grid;grid-template-columns:minmax(240px,2fr) 130px 140px 104px 130px minmax(200px,1.8fr);gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);min-width:900px;font-size:13.5px}
.wth{font-size:12px;color:var(--fg-muted);border-top:0;padding-top:2px}
.wt .r{text-align:right}
.fm{gap:12px;padding:16px}
.fm label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--fg-muted);font-weight:500}
.fm input[type=text]{width:100%}
.fl{font-size:12.5px;color:var(--fg-muted);font-weight:500;display:block;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pk{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);font-size:13px;background:var(--card)}
.pk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pk:focus-visible{outline:2px solid var(--accent)}
.cks{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.ck{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;font-size:13px!important;color:var(--fg)!important;font-weight:400!important;cursor:pointer;padding:3px 0}
.ck input{accent-color:var(--accent);width:16px;height:16px;flex:none}
@media (max-width:900px){.qrow{grid-template-columns:1fr}.qact{align-items:flex-start}.cks{grid-template-columns:1fr}}
.crumb{display:flex;gap:8px;align-items:center;font-size:13.5px}
.pmh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pmt h1{font-size:28px;font-weight:700;letter-spacing:-.015em;margin-bottom:8px}
.pmstats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;padding:0}
.pmstats>div{padding:14px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.pmstats>div:first-child{border-left:0}
.pmstats small{font-size:12px;color:var(--fg-muted)}.pmstats b{font-weight:600}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line2)}
.ptabs button{all:unset;cursor:pointer;padding:10px 16px;font-weight:500;color:var(--fg-muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.ptabs button:focus-visible{outline:2px solid var(--accent)}
.board{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px;align-items:start;overflow-x:auto}
.col{background:var(--sunken);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:200px;border:2px dashed transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}

const decLate=r=>!st.status[r.id]&&r.decideBy<TODAYD;
function decisions(){
  const W=waiting(), late=W.filter(decLate), hi=W.filter(r=>r.pri==='High');
  const metrics=strip([
    {l:'Outstanding',v:W.length,s:'waiting for the committee',act:'dfilt',attrs:'data-v="all"',on:st.dfilt==='all'},
    {l:'Overdue',v:late.length,tone:late.length?'r':'',s:'past their decide-by date',act:'dfilt',attrs:'data-v="late"',on:st.dfilt==='late'},
    {l:'High priority',v:hi.length,tone:hi.length?'a':'',s:'marked high on the request',act:'dfilt',attrs:'data-v="high"',on:st.dfilt==='high'}
  ]);
  const ALL=REQUESTS.filter(reqInScope), RQ=ALL.filter(r=>st.dfilt==='late'?decLate(r):st.dfilt==='high'?(r.pri==='High'&&!st.status[r.id]):true);
  const head=`${opsHead(`${W.length} waiting${st.scope!=='all'?' · '+esc(st.scope):''}`)}${metrics}`;
  if(!RQ.length) return `${head}<div class="card"><div class="empty">${ic('check')}<b>${ALL.length?'Nothing matches this filter':`No requests need ${esc(st.scope)}`}</b><span>${ALL.length?'Select Outstanding to see every request.':'Clear the team filter to see every request.'}</span></div></div>`;
  const r=RQ.find(x=>x.id===st.req)||RQ[0];
  return `${head}
    <div class="dec">
      <div class="card"><div class="cardh"><h2>Request queue</h2><span>${RQ.length}</span></div>
        ${RQ.map(q0=>{const q=scopedReq(q0),done=st.status[q.id],s=st.start[q.id]||0,fits=!Object.keys(overloads(q,s)).length;return `<button type="button" class="qi" data-act="pickreq" data-id="${q.id}" aria-pressed="${q.id===r.id}"><span class="ico ${done==='Approved'?'ok':done?'n':fits?'ok':'bad'}">${ic(done?'check':'alert')}</span><span class="body"><b>${esc(q.n)}</b><small>${done?esc(done):`${scoped()?`${esc(st.scope)} · ${q.lines.map(l=>l.h+'h/wk').join(', ')}`:esc(q.by)} · ${q.dur} weeks · ${fits?'Fits now':'Needs a later start'}`}</small>${done?'':`<span class="row" style="gap:6px;margin-top:3px">${decLate(q0)?`<span class="pill r">Decide by ${dNum(q0.decideBy)} · overdue</span>`:`<span class="muted" style="font-size:12px">Decide by ${dNum(q0.decideBy)}</span>`}${q0.pri==='High'?'<span class="pill a">High priority</span>':''}</span>`}</span></button>`;}).join('')}
      </div>
      <div class="card">${decPanel(r)}</div>
    </div>`;
}
const scoped=()=>st.scope&&st.scope!=='all';
const scopedReq=r=>scoped()?{...r,lines:r.lines.filter(l=>l.d===st.scope)}:r;
function decPanel(r0){
  const r=scopedReq(r0), others=r0.lines.filter(l=>!r.lines.includes(l));
  const id=r.id, done=st.status[id], s=st.start[id]||0;
  const ex=reqExtra(r,s), ov=overloads(r,s), fits=!Object.keys(ov).length, e=earliest(r);
  const end=Math.min(WEEKS-1,s+r.dur-1), ws=Array.from({length:end-s+1},(_,k)=>s+k);
  return `<div class="dpanel">
    <div class="dtop"><div><small>${esc(r.by)} · ${esc(done||r.status)} · ${esc(r0.pri)} priority${done?'':` · decide by ${dNum(r0.decideBy)}`}</small><h2 id="decTitle">${esc(r.n)}</h2></div>
      ${done?'':`<div class="stepper"><button type="button" data-act="step" data-id="${id}" data-d="-1" aria-label="Earlier start" ${s===0?'disabled':''}>−</button><div><small>Start week</small><b>${wk(s)}</b><small>${r.dur} weeks, ends ${wk(end)}</small></div><button type="button" data-act="step" data-id="${id}" data-d="1" aria-label="Later start" ${s>=WEEKS-1?'disabled':''}>+</button></div>`}</div>
    ${done?`<div class="verdict ${done==='Approved'?'ok':'n'}"><b>${esc(done)}</b><span>${done==='Approved'?'Its work is assigned to the people with the most room and counts in capacity. It now shows in Portfolio.':'Moved out of this round. It stays in the queue for next time.'}</span></div>`:
      `<div class="verdict ${fits?'ok':'bad'}"><b>${fits?(scoped()?`Fits for ${esc(st.scope)}`:'Fits'):(scoped()?`Too much for ${esc(st.scope)}`:'Too much for these teams')}</b><span>${fits?(scoped()?`${esc(st.scope)} stays under capacity while it runs.`:'No team goes over while it runs.'):Object.entries(ov).map(([d,w])=>`${d} over in ${w.length} week${w.length>1?'s':''}`).join('; ')+'.'}</span>${!fits&&e>=0?`<span>Earliest start that fits: <b style="font-size:15px">${wk(e)}</b></span>`:''}${!fits&&e<0?'<span>No start in the next 12 weeks fits. Reduce scope or move other work.</span>':''}</div>`}
    ${scoped()?`<div class="why" style="background:var(--sunken)">Showing only the work assigned to <b>${esc(st.scope)}</b>: ${r.lines.map(l=>l.h+'h a week').join(', ')} for ${r.dur} weeks.${others.length?` The full request also needs ${others.map(l=>esc(l.d)).join(', ')}. Approving adds work for every team it needs.`:''}</div>`:''}
    <div class="dgrid"><table><thead><tr><th>${scoped()?esc(st.scope):'Team'}, with this request ${done?'':'added'}</th>${ws.map(w=>`<th>${wk(w)}</th>`).join('')}</tr></thead><tbody>
      ${r.lines.map(l=>`<tr><td class="lbl">${esc(l.d)}<small>${l.h}h a week</small></td>${ws.map(w=>{const u=deptUtil(l.d,w,done?[]:ex).u;return `<td class="${cellCls(u)}" title="${wk(w)}">${Math.round(u*100)}%</td>`;}).join('')}</tr>`).join('')}
    </tbody></table></div>
    ${done?'':st.role==='mgr'?`<div class="btns"><span class="muted" style="font-size:13px;flex:1">The committee approves requests. Flag it if ${esc(st.scope)} cannot take this on.</span><button type="button" class="btn sec" data-act="flag" data-d="${esc(st.scope)}">${ic('flag')} Flag a concern</button></div>`:`<div class="btns">${!fits&&e>=0&&e!==s?`<button type="button" class="btn sec" data-act="earliest" data-id="${id}">Move to ${wk(e)}</button>`:''}<span style="flex:1"></span><button type="button" class="btn sec" data-act="defer" data-id="${id}">Defer</button><button type="button" class="btn" data-act="approve" data-id="${id}">Approve</button></div>`}
  </div>`;

function rebalancePlan(p){

// Billing rule (to confirm with Liberty): time on work linked to a project is billable to that project; everything else is internal.
const isBill=i=>i.links.some(l=>PROJECTS.some(p=>p.n===l));
const chargeTo=i=>i.links.find(l=>PROJECTS.some(p=>p.n===l))||i.links[0]||'General / internal';
const dayH=(i,d,pid)=>(i.logs||[]).filter(l=>l.by===pid&&l.d===d).reduce((a,l)=>a+l.h,0);
function setDayH(i,d,pid,v){ i.logs=(i.logs||[]).filter(l=>!(l.by===pid&&l.d===d)); if(v>0) i.logs.push({k:nextLog++,d,h:v,by:pid,note:'',src:'Timesheet'}); }
const tsKey=(pid,w)=>pid+':'+w;
function timesheet(me){
  const w=st.tsw, days=[0,1,2,3,4].map(k=>w*7+k), key=tsKey(me.id,w), sub=st.tsSub[key];

  const capFull=capW(me,w), capTD=Math.round(capFull*open.length/5*10)/10;

  const byCharge={}; rows.forEach(i=>{const h=rowT(i); if(h) byCharge[chargeTo(i)]=(byCharge[chargeTo(i)]||0)+h;});
  const charges=Object.entries(byCharge).sort((a,b)=>b[1]-a[1]);

      <span class="${!sub?'chip warn':sub.status==='approved'?'chip ok':sub.status==='returned'?'chip bad':'chip n'}">${!sub?'Not submitted':sub.status==='approved'?'Approved by your team lead':sub.status==='returned'?'Returned: please fix and resubmit':`Submitted ${esc(sub.on)}, waiting for approval`}</span></div>
    ${sub&&sub.status==='returned'?`<div class="why" style="background:var(--bad-soft)"><b>Your team lead returned this week.</b> ${esc(sub.note||'')}${qd.length?`<br>Asked about: ${esc(qd.join('; '))}.`:''}</div>`:''}
    ${metrics}
    <div class="card scroll"><table class="tst"><thead><tr><th>Task</th><th>Charged to</th>${days.map(d=>`<th class="c${d===TODAYD?' today':''}">${dayDate(d).toLocaleDateString('en-US',{weekday:'short'})}<small>${dNum(d)}</small></th>`).join('')}<th class="c">Total</th></tr></thead><tbody>
      ${rows.map(i=>`<tr><td><b>${esc(i.n)}</b></td><td>${isBill(i)?'<span class="bill y">Billable</span>':'<span class="bill">Internal</span>'} <span class="muted">${esc(chargeTo(i))}</span></td>
        ${days.map(d=>{const h=dayH(i,d,me.id);return `<td class="c"><input type="number" min="0" max="24" step="0.25" inputmode="decimal" data-ts="${i.id}:${d}" value="${h||''}" placeholder="${d>TODAYD?'':'0'}" ${dis(d)?'disabled':''} aria-label="${esc(i.n)}, ${dayDate(d).toLocaleDateString('en-US',{weekday:'long'})}"></td>`;}).join('')}
        <td class="c num"><b>${hfmt(rowT(i))}</b></td></tr>`).join('')||`<tr><td colspan="8" class="muted" style="padding:16px">No hours yet this week. Add a task below, or use the timer on My tasks.</td></tr>`}
      </tbody><tfoot><tr><td colspan="2">${!sub&&addable.length?`<label class="tsadd"><span class="sr">Add a task to this timesheet</span><select id="ts-add"><option value="">+ Add a task…</option>${addable.map(i=>`<option value="${i.id}">${esc(i.n)}</option>`).join('')}</select></label>`:'<b>Total</b>'}</td>
        ${days.map(d=>{const h=rows.reduce((a,i)=>a+dayH(i,d,me.id),0);return `<td class="c num">${d>TODAYD?'<span class="muted">·</span>':`<b class="${h>10?'ta':''}">${hfmt(h)}</b>`}</td>`;}).join('')}<td class="c num"><b>${hfmt(tot)}</b></td></tr></tfoot></table></div>

    </div>`;

function logTime(i,h,d,note,src){
  if(!isAdv()&&i.st==='todo') setStatus(i,'doing');
  const by=st.mode==='simple'&&st.me?st.me:i.p;
  if(!by){ toast('Give this item an owner before logging time.'); return false; }

}

function needTime(i,to){

  const run=st.timer&&st.timer.id===i.id?elapsedH():0; if(run) st.timer=null;

  else if(a==='editproj'){ const p=PROJECTS.find(x=>x.n===el.dataset.n); st.pform={orig:p.n,n:p.n,div:p.div,pri:p.pri,owner:p.owner,sponsor:p.sponsor,stage:p.stage,s:p.s,e:p.e,goal:p.goal,ms:p.ms.map(m=>[m[0],m[1]])}; st.confirmDel=null; open('pform'); }
  else if(a==='saveproj'){ readProjForm(); const f=st.pform; if(!f.n){ toast('Give the project a name.'); document.getElementById('p-n').focus(); return; }

document.addEventListener('dragover',e=>{ const col=e.target.closest&&e.target.closest('[data-drop]'); if(col&&dragId!=null){ e.preventDefault(); document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over')); col.classList.add('over'); }});
document.addEventListener('drop',e=>{ const col=e.target.closest&&e.target.closest('[data-drop]'); if(col&&dragId!=null){ e.preventDefault(); const i=ITEMS.find(x=>x.id===dragId); if(i&&i.st!==col.dataset.drop){ setStatus(i,col.dataset.drop); toast(`Moved to ${STATUSES.find(x=>x[0]===col.dataset.drop)[1]}.`); } dragId=null; render(); }});
document.addEventListener('submit',e=>{ const f=e.target; if(f.dataset.form!=='qadd') return; e.preventDefault(); const inp=f.querySelector('input'); const v=inp.value.trim(); if(!v) return;
  const pr=PROJECTS.find(x=>x.n===st.proj); const any=ITEMS.find(i=>i.links.includes(st.proj)&&i.p); const team=any?pById(any.p).d:'Admin / Program';
  ITEMS.push({id:nextId++,n:v,t:'project',p:null,team,h:2,s:0,e:Math.min(WEEKS-1,1),links:[st.proj],tent:false,st:f.dataset.st,src:'Added on the board'});
  FEED.unshift({t:`New task on ${st.proj}`,s:`${v} · Just now`}); toast('Added. It sits in the work queue until someone owns it.'); render(); const n=document.getElementById(inp.id); if(n) n.focus(); });
document.getElementById('scrim').addEventListener('click',close);
document.addEventListener('dblclick',e=>{ const el=e.target.closest('[data-act="mcycle"]'); if(!el||isAdv()) return; clearTimeout(st.clickT); const i=ITEMS.find(x=>x.id===+el.dataset.id); if(i&&i.st!=='done') needTime(i,'done'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&st.drawer) close(); });
['p2','p3','p4','p5','p6','p8','p9','p10','p11'].forEach(id=>{ const T=tsTotals(id,-2); if(T.tot) st.tsSub[tsKey(id,-2)]={on:'Nov 21',tot:T.tot,bill:T.bill,status:'submitted'}; });
const h=location.hash.slice(1); if(ROUTES.includes(h)) goTab(h);
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1); if(ROUTES.includes(k)){goTab(k);st.drawer=null;render();}});
render();

})();
</script>
